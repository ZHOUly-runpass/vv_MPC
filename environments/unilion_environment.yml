name: unilion
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pytorch=2.5.0
  - torchvision=0.20.0
  - pytorch-cuda=12.4
  # Keep CUDA headers aligned with nvcc. Without these pins Conda may solve
  # cuda-cccl/cuda-version to a newer major release (observed: 13.3), which
  # makes nvcc 12.4 fail while parsing cuda_fp16.h.
  - cuda-version=12.4
  - cuda-cccl=12.4
  - cuda-cccl_linux-64=12.4
  - cuda-nvcc=12.4
  - cuda-cudart-dev=12.4
  - ninja
  - cmake
  - numpy=1.23.5
  - pip:
      - addict==2.4.0
      - casadi==3.7.2
      - einops==0.8.0
      - fire==0.7.0
      - lyft-dataset-sdk==0.0.8
      - mmdet==2.28.2
      - mmsegmentation==0.30.0
      - numba==0.58.0
      - nuscenes-devkit==1.1.10
      - plyfile==1.1.3
      - pyquaternion==0.9.9
      - scikit-image==0.24.0
      - scipy==1.10.1
      - spconv-cu120==2.3.6
      - tensorboard==2.21.0
      - timm==1.0.9
      - trimesh==4.12.2
      - yapf==0.33.0
